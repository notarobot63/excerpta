name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: host

    steps:
      - name: Checkout
        run: git clone --depth=1 https://$REGISTRY_USER:${{ secrets.REGISTRY_TOKEN }}@$REGISTRY_URL/$REGISTRY_USER/excerpta.git .

      - name: Login registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login $REGISTRY_URL -u $REGISTRY_USER --password-stdin

      - name: Build & push
        run: |
          SHA=${GITHUB_SHA::7}
          IMAGE=$REGISTRY_URL/$REGISTRY_USER/excerpta
          docker build \
            --build-arg GIT_COMMIT=$SHA \
            -t $IMAGE:$SHA \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:$SHA
          docker push $IMAGE:latest

      - name: Deploy
        run: |
          REGISTRY_IMAGE=$REGISTRY_URL/$REGISTRY_USER/excerpta:latest
          cp docker-compose.prod.yml $DEPLOY_PATH/docker-compose.prod.yml
          REGISTRY_IMAGE=$REGISTRY_IMAGE docker compose -f $DEPLOY_PATH/docker-compose.prod.yml pull
          REGISTRY_IMAGE=$REGISTRY_IMAGE docker compose -f $DEPLOY_PATH/docker-compose.prod.yml up -d

      - name: Health check
        run: sleep 5 && curl -sf http://localhost:$DEPLOY_PORT/

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST $NTFY_URL \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: ✅ Excerpta déployé" \
            -d "commit ${GITHUB_SHA::7} en prod"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST $NTFY_URL \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: ❌ Excerpta deploy failed" \
            -d "commit ${GITHUB_SHA::7}"
