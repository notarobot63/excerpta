name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: host

    steps:
      - name: Checkout
        run: git clone --depth=1 https://thomas:${{ secrets.REGISTRY_TOKEN }}@GIT_HOST/Thomas/excerpta.git .

      - name: Login registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login GIT_HOST -u thomas --password-stdin

      - name: Build & push
        run: |
          SHA=${GITHUB_SHA::7}
          docker build \
            --build-arg GIT_COMMIT=$SHA \
            -t GIT_HOST/thomas/excerpta:$SHA \
            -t GIT_HOST/thomas/excerpta:latest \
            .
          docker push GIT_HOST/thomas/excerpta:$SHA
          docker push GIT_HOST/thomas/excerpta:latest

      - name: Deploy
        run: |
          eval $(ssh-agent -s)
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | ssh-add -
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml root@LAN_HOST_2:/srv/excerpta/docker-compose.prod.yml
          ssh -o StrictHostKeyChecking=no root@LAN_HOST_2 \
            "echo '${{ secrets.REGISTRY_TOKEN }}' | docker login GIT_HOST -u thomas --password-stdin && \
             cd /srv/excerpta && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d"

      - name: Health check
        run: |
          sleep 5
          ssh -o StrictHostKeyChecking=no root@LAN_HOST_2 \
            "curl -sf http://localhost:8070/ || exit 1"

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST https://NTFY_HOST/Deployments \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: ✅ Excerpta déployé" \
            -d "commit ${GITHUB_SHA::7} en prod"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST https://NTFY_HOST/Deployments \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: ❌ Excerpta deploy failed" \
            -d "commit ${GITHUB_SHA::7} — https://GIT_HOST/Thomas/excerpta/actions"
