stages:
  - build
  - deploy

variables:
  IMAGE: "$REGISTRY_URL/$REGISTRY_USER/excerpta"
  INTERNAL_IMAGE: "LAN_HOST_1:5050/thomas/excerpta"

build:
  stage: build
  tags: [docker]
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
    - docker build --build-arg GIT_COMMIT="$CI_COMMIT_SHORT_SHA" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
  only: [main]

deploy:
  stage: deploy
  tags: [shell]
  script:
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - scp -o StrictHostKeyChecking=no docker-compose.prod.yml root@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml
    - |
      ssh -o StrictHostKeyChecking=no root@$DEPLOY_HOST "
        echo '$REGISTRY_TOKEN' | docker login $REGISTRY_URL -u $REGISTRY_USER --password-stdin &&
        REGISTRY_IMAGE=LAN_HOST_1:5050/thomas/excerpta:latest docker compose -f $DEPLOY_PATH/docker-compose.prod.yml pull &&
        REGISTRY_IMAGE=LAN_HOST_1:5050/thomas/excerpta:latest docker compose -f $DEPLOY_PATH/docker-compose.prod.yml up -d"
    - sleep 5
    - curl -sf "http://$DEPLOY_HOST:$DEPLOY_PORT/"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        curl -s -X POST "$NTFY_URL" -H "Authorization: Bearer $NTFY_TOKEN" -H "Title: Excerpta deploye" -d "commit $CI_COMMIT_SHORT_SHA en prod"
      else
        curl -s -X POST "$NTFY_URL" -H "Authorization: Bearer $NTFY_TOKEN" -H "Title: Excerpta deploy failed" -d "commit $CI_COMMIT_SHORT_SHA"
      fi
  only: [main]
  needs: [build]
