services:
  excerpta:
    # Image publique par défaut, pour que ce fichier serve tel quel.
    # Un déploiement depuis un autre registre surcharge REGISTRY_IMAGE.
    image: ${REGISTRY_IMAGE:-ghcr.io/notarobot63/excerpta:latest}
    container_name: excerpta
    restart: unless-stopped
    ports:
      - "8070:8000"
    env_file: .env
    volumes:
      - excerpta_data:/app/data

volumes:
  excerpta_data:
