{% extends "base.html" %}

{% block title %}
  {% if current_tag %}#{{ current_tag }} - {% elif current_group %}{{ _("Folder") }} - {% endif %}Excerpta
{% endblock %}

{% block content %}

<div id="results">
{% include "links/_results.html" %}
</div>

<script nonce="{{ request.state.nonce }}">
(function() {
  var resultsEl = document.getElementById('results');
  if (!resultsEl) return;

  var LBL_SELECTED_ONE = {{ ngettext("{n} link selected", "{n} links selected", 1)|tojson }};
  var LBL_SELECTED_MANY = {{ ngettext("{n} link selected", "{n} links selected", 2)|tojson }};
  var LBL_CONFIRM_ONE = {{ ngettext("Delete {n} link?", "Delete {n} links?", 1)|tojson }};
  var LBL_CONFIRM_MANY = {{ ngettext("Delete {n} link?", "Delete {n} links?", 2)|tojson }};

  // ── Sélection groupée (état) ───────────────────────────────────────────
  var _selectedIds = new Set();

  function onSelectChange(cb) {
    var card = cb.closest('.link-card');
    if (cb.checked) { _selectedIds.add(cb.value); if (card) card.classList.add('link-selected'); }
    else { _selectedIds.delete(cb.value); if (card) card.classList.remove('link-selected'); }
    updateBulkBar();
  }

  function updateBulkBar() {
    var bar = document.getElementById('bulk-bar');
    var cnt = document.getElementById('bulk-count');
    if (!bar || !cnt) return;
    var n = _selectedIds.size;
    bar.classList.toggle('bulk-bar--visible', n > 0);
    cnt.textContent = (n > 1 ? LBL_SELECTED_MANY : LBL_SELECTED_ONE).replace('{n}', n);
  }

  function clearBulkSelect() {
    resultsEl.querySelectorAll('.link-select').forEach(function(c) {
      c.checked = false;
      var card = c.closest('.link-card'); if (card) card.classList.remove('link-selected');
    });
    _selectedIds.clear();
    updateBulkBar();
  }

  function submitBulkDelete() {
    var n = _selectedIds.size;
    if (n === 0) return;
    if (!window.confirm((n > 1 ? LBL_CONFIRM_MANY : LBL_CONFIRM_ONE).replace('{n}', n))) return;
    var ids = Array.from(_selectedIds);
    var cards = ids.map(function(id) { return resultsEl.querySelector('.link-card[data-link-id="' + id + '"]'); });
    cards.forEach(function(c) { if (c) c.classList.add('link-deleting'); });
    clearBulkSelect();
    var form = document.getElementById('bulk-delete-form');
    var csrf = form ? form.querySelector('input[name="csrf_token"]') : null;
    var fd = new FormData();
    ids.forEach(function(id) { fd.append('link_ids', id); });
    fetch('/links/bulk-delete', {
      method: 'POST',
      headers: { 'X-CSRF-Token': csrf ? csrf.value : '' },
      body: fd,
    }).then(function(r) {
      if (r.ok) cards.forEach(function(c) { if (c) c.remove(); });
      else cards.forEach(function(c) { if (c) c.classList.remove('link-deleting'); });
    }).catch(function() {
      cards.forEach(function(c) { if (c) c.classList.remove('link-deleting'); });
    });
  }

  // ── Délégation : survit aux remplacements AJAX de #results ──────────────
  resultsEl.addEventListener('dragstart', function(e) {
    var card = e.target.closest && e.target.closest('.link-card[data-link-id]');
    if (!card) return;
    if (e.target.classList && (e.target.classList.contains('link-select-wrap') || e.target.classList.contains('link-select'))) {
      e.preventDefault(); return;
    }
    window._draggedLinkId = card.dataset.linkId;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.linkId);
    setTimeout(function() { card.style.opacity = '0.45'; }, 0);
  });

  resultsEl.addEventListener('dragend', function(e) {
    var card = e.target.closest && e.target.closest('.link-card');
    if (card) card.style.opacity = '';
    window._draggedLinkId = null;
  });

  resultsEl.addEventListener('change', function(e) {
    if (e.target.classList && e.target.classList.contains('link-select')) onSelectChange(e.target);
  });

  resultsEl.addEventListener('click', function(e) {
    if (e.target.id === 'bulk-delete-btn') { submitBulkDelete(); return; }
    if (e.target.id === 'bulk-cancel-btn') { clearBulkSelect(); return; }
    var pag = e.target.closest && e.target.closest('.pagination a');
    if (pag) { e.preventDefault(); navigateTo(pag.getAttribute('href')); }
  });

  // ── Surlignage des termes recherchés dans les titres (sûr : textContent) ──
  function currentQuery() {
    if (searchInput && searchInput.value) return searchInput.value.trim();
    return (new URLSearchParams(location.search).get('q') || '').trim();
  }
  function highlightResults() {
    var q = currentQuery();
    if (!q) return;
    var terms = q.split(/\s+/).filter(Boolean)
      .map(function(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    if (!terms.length) return;
    var re = new RegExp('(' + terms.join('|') + ')', 'gi');
    resultsEl.querySelectorAll('.link-title').forEach(function(a) {
      var txt = a.textContent;
      re.lastIndex = 0;
      if (!re.test(txt)) return;
      re.lastIndex = 0;
      a.textContent = '';
      var last = 0, m;
      while ((m = re.exec(txt)) !== null) {
        if (m.index > last) a.appendChild(document.createTextNode(txt.slice(last, m.index)));
        var mk = document.createElement('mark');
        mk.textContent = m[0];
        a.appendChild(mk);
        last = m.index + m[0].length;
        if (m.index === re.lastIndex) re.lastIndex++;  // anti-boucle 0-longueur
      }
      if (last < txt.length) a.appendChild(document.createTextNode(txt.slice(last)));
    });
  }

  // ── Recherche temps réel + pagination AJAX ──────────────────────────────
  function swapResults(url) {
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    // Annuler les requêtes proxy/img en cours avant de swapper (libère les connexions HTTP)
    resultsEl.querySelectorAll('img[src]').forEach(function(img) { img.src = ''; });
    return fetch(url + sep + 'partial=1', { headers: { 'X-Partial': '1' } })
      .then(function(r) { return r.text(); })
      .then(function(html) {
        resultsEl.innerHTML = html;
        _selectedIds.clear();
        updateBulkBar();
        highlightResults();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
  }

  function navigateTo(url) {
    swapResults(url).then(function() { history.pushState({ excerpta: true }, '', url); });
  }

  var searchInput = document.querySelector('.search-input[name="q"]');
  if (searchInput && searchInput.form) {
    var form = searchInput.form;
    var debounce;
    function runSearch() {
      var params = new URLSearchParams(new FormData(form)); // q + tag/group éventuels
      var qv = (params.get('q') || '').trim();
      if (qv === '') { params.delete('q'); }
      else if (qv.length < 2) { return; } // attendre 2 caractères avant de lancer
      var qs = params.toString();
      navigateTo('/' + (qs ? '?' + qs : ''));
    }
    searchInput.addEventListener('input', function() {
      clearTimeout(debounce);
      debounce = setTimeout(runSearch, 250);
    });
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      clearTimeout(debounce);
      runSearch();
    });
  }

  window.addEventListener('popstate', function() {
    swapResults(location.pathname + location.search);
    if (searchInput) {
      searchInput.value = new URLSearchParams(location.search).get('q') || '';
    }
  });

  highlightResults();  // surligne au chargement initial (page de recherche directe)
})();
</script>

{% endblock %}
